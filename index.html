.homelbl:hover{background:rgba(255,255,255,.15)}
.panel{position:absolute;z-index:30;background:#fff;border:2px solid var(--navy);border-radius:11px;padding:8px;box-shadow:0 8px 22px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:6px}
.panel button.item{display:block;width:100%;text-align:left;background:#EFEFF1;border-radius:8px;padding:7px 11px;font-size:14px;color:var(--navy)}
.panel button.item:hover{background:#E1EEF0}
.panel button.item.sel{background:#DCEFF2;font-weight:700}
.panel button.item[disabled]{opacity:.4;cursor:not-allowed}
.panel button.close{align-self:flex-start;font-size:11px;font-weight:700;color:var(--antr);padding:2px 8px 0}
.card{position:absolute;background:#fff;border-radius:12px;border:1px solid #E1E1E4;box-shadow:0 1px 5px rgba(24,33,62,.07)}
.card h2{font-size:19px;font-weight:700;color:var(--navy)}
.kpi{padding:10px 12px}
.kpi .lb{font-size:13px;color:#5d5d63;white-space:nowrap}
.kpi .vl{font-size:31px;font-weight:700;color:var(--navy);line-height:1.15;margin-top:3px;white-space:nowrap}
.kpi .dl{font-size:11px;margin-top:2px;white-space:nowrap}
.kpi img.ic{position:absolute;right:10px;top:8px;height:26px}
.up{color:#00A04A}.dn{color:var(--rosso)}
.big{font-weight:800;line-height:1}
.segbar{height:28px;display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:700;font-size:14.5px;white-space:nowrap}
.rowp{display:flex;justify-content:space-between;font-size:15.5px;line-height:25px}
.rowp b{font-weight:700}
.rowp.link{cursor:pointer;border-radius:5px;padding:0 4px;margin:0 -4px}
.rowp.link:hover{background:#F0F0F4}
.zrow{cursor:pointer;margin-bottom:4px;padding:2px 4px;border-radius:6px;margin-left:-4px;margin-right:-4px}
.zrow:hover{background:#F2F1F6}.zrow.sel{background:#ECEAF3}
.zrow .t{display:flex;justify-content:space-between;font-size:15.5px;line-height:22px}
.zrow .t b{font-weight:800}
.zrow .bar{height:12px;background:var(--vpast);border-radius:1px;transition:width .35s}
.btn-det{position:absolute;height:22px;border:1.6px solid var(--navy);border-radius:8px;font-size:13.5px;font-weight:700;padding:0 12px;background:#fff;display:flex;align-items:center}
.btn-det:hover{background:#E8F5F7}
.map-region{fill:#E6E2EC;stroke:#fff;stroke-width:2.2;transition:fill .15s;cursor:default}
.map-region.hi{fill:#D3CDE0}
.map-region.dim{fill:#EFEDF3}
.map-region.has{cursor:pointer}
.map-region:hover{fill:#C9C1DA}
.bubble{cursor:pointer;transition:opacity .2s,r .2s;stroke:#fff;stroke-width:3}
.bubble:hover{stroke:var(--navy)}
.bubble.off{opacity:.22}
.callout{position:absolute;width:182px;border:2px solid var(--azzurro);border-radius:10px;background:#fff;padding:8px 11px 8px;font-size:15px;line-height:1.2;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.callout b{display:block;font-weight:800}
.callout .mw{color:var(--azzurro);font-weight:800}
.callout .tc{color:#707078}
.callout img{position:absolute;right:10px;top:9px;height:28px}
.callout a{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;color:var(--azzurro);cursor:pointer;text-decoration:underline}
.legend{font-size:13.5px;color:#444;display:flex;gap:14px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{background:var(--navy);color:#fff;text-align:left;font-weight:700;padding:0 10px;height:46px}
table.t th.r,table.t td.r{text-align:right}
table.t td{padding:0 10px;height:45px;border-bottom:1px solid #EEE}
table.t tr.row{cursor:pointer}
table.t tr.row:nth-child(even){background:#F7F7F9}
table.t tr.row:hover{background:#E8F3F5}
.insight{position:absolute;height:22px;border-radius:8px;font-size:12.5px;padding:0 13px;display:flex;align-items:center}
.cmpchip{position:absolute;height:25px;border-radius:13px;font-size:13.5px;padding:0 14px;display:flex;align-items:center;gap:7px;white-space:nowrap;font-weight:600}
.cmpchip.on{background:var(--azzurro);color:#fff}
.cmpchip.off{background:#EEF0F3;color:#444}
.cmpchip:not(.on):hover{background:#DDE9EC}
.range{position:absolute;height:24px;border-radius:12px;background:#EEF0F3;font-size:13px;padding:0 12px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.range b{font-weight:800}
.range input{font:inherit;font-size:12.5px;border:1px solid #cfd4da;border-radius:6px;background:#fff;padding:0 3px;height:19px;color:var(--navy)}
.range.edit{background:#DCEFF2;box-shadow:inset 0 0 0 1.5px var(--azzurro)}
.chip{position:absolute;height:27px;border-radius:9px;font-size:14px;font-weight:700;padding:0 12px;display:flex;align-items:center;white-space:nowrap}
.chip.ok{background:#E7F3DF;color:#2F6B12}
.chip.al{background:#FFF1E8;color:#C24400;box-shadow:inset 0 0 0 1.5px var(--arancio)}
.chip.al:hover{background:#FFE3D2}
.chip.none{background:#F0F0F2;color:#888;cursor:default}
.gcard{position:absolute;width:125px;height:125px;border-radius:12px;background:#F5F6F8;border:1px solid #E3E6EA;text-align:center}
.gcard img,.gcard svg.gi{position:absolute;left:50%;top:13px;transform:translateX(-50%);height:33px;width:auto}
.gcard .v{position:absolute;left:0;right:0;top:57px;font-size:21px;font-weight:800;color:var(--azzurro);white-space:nowrap}
.gcard .l{position:absolute;left:6px;right:6px;top:87px;font-size:12px;line-height:1.2;color:#5d5d63}
.gcard .l small{display:block;font-size:11px;color:#888;margin-top:1px}
#tip{position:fixed;z-index:1000;pointer-events:none;background:var(--navy);color:#fff;font-size:12px;line-height:1.35;padding:6px 9px;border-radius:7px;display:none;box-shadow:0 3px 10px rgba(0,0,0,.3);white-space:nowrap}
#tip b{font-weight:700}
.chartleg{position:absolute;display:flex;gap:18px;justify-content:center;font-size:13px;color:#444}
.chartleg i{display:inline-block;width:20px;height:3px;margin-right:6px;vertical-align:3px;border-radius:2px;position:relative}
.chartleg i::after{content:"";position:absolute;left:6px;top:-3px;width:8px;height:8px;border-radius:50%;background:inherit}
svg text{font-family:inherit}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:.4}to{opacity:1}}
.empty{position:absolute;color:#777;font-size:14px}

/* ===== polish (Power BI compatible: rounded corners, shadows, gradients) ===== */
#stage{background:linear-gradient(180deg,#F7F7F9 0%,#EFEFF2 100%)}
#hdr{background:radial-gradient(520px 160px at 88% 0%,rgba(27,154,170,.28),transparent 70%),linear-gradient(120deg,#181B3A 0%,#18213E 60%,#1b2a52 100%);box-shadow:0 6px 18px rgba(24,33,62,.28);z-index:5}
#hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#1B9AAA 0%,#62A830 45%,#F9B122 70%,#DD052B 100%)}
h1.title,.sub,.badge,.homebtn,.homelbl,.menubtn,.pillgrp{z-index:6}
.card{border:1px solid rgba(24,33,62,.06);box-shadow:0 8px 24px rgba(24,33,62,.08),0 1px 3px rgba(24,33,62,.06);border-radius:16px;background:linear-gradient(180deg,#fff,#FCFCFD)}
.kpi{overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(180deg,#1B9AAA,#00665B)}
.kpi .ico{position:absolute;right:10px;top:34px;width:32px;height:32px;border-radius:50%;background:#E4F4F6;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(27,154,170,.18)}
.kpi .ico img,.kpi .ico svg{height:19px!important;width:19px!important;position:static!important;transform:none!important}
.kpi .vl{font-size:30px;letter-spacing:-.5px}
.kpi .lb{font-weight:600}
.pillgrp{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 2px 8px rgba(0,0,0,.25)}
.pillgrp button.on{background:linear-gradient(135deg,#25B1C2,#1B9AAA);box-shadow:0 2px 10px rgba(27,154,170,.6)}
.menubtn{box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 2px 8px rgba(0,0,0,.22)}
.homebtn{background:linear-gradient(135deg,#25B1C2,#1B9AAA);box-shadow:0 3px 12px rgba(27,154,170,.55)}
.badge{box-shadow:0 3px 10px rgba(0,0,0,.25)}
.panel{border-radius:14px;border:1px solid rgba(24,33,62,.15);box-shadow:0 18px 40px rgba(24,33,62,.35)}
.btn-det{background:linear-gradient(180deg,#fff,#F0F5F6);box-shadow:0 2px 6px rgba(24,33,62,.15)}
.cmpchip.on{background:linear-gradient(135deg,#25B1C2,#1B9AAA);box-shadow:0 2px 8px rgba(27,154,170,.45)}
.mapsvg{filter:drop-shadow(0 8px 10px rgba(24,33,62,.18))}
.map-region{fill:url(#rg);stroke:#fff;stroke-width:2.6}
.map-region.hi,.map-region:hover{fill:url(#rgh)}
.map-region.dim{fill:#F1EFF5}
.bubble{filter:drop-shadow(0 4px 5px rgba(0,0,0,.3));cursor:pointer}
.gcard{background:linear-gradient(180deg,#fff,#EEF6F7);border:1px solid #DCEBEE;box-shadow:0 4px 12px rgba(24,33,62,.07)}
.gcard::before{content:"";position:absolute;left:50%;top:6px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:#DDF0F3;box-shadow:inset 0 0 0 1px rgba(27,154,170,.15)}
.gcard img,.gcard svg.gi{top:29px!important;transform:translate(-50%,-50%)!important;height:27px!important;z-index:1}
.gcard .v{top:57px}.gcard .l{top:85px}
#tip{border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.35);background:rgba(24,33,62,.96)}
.bar:hover rect:nth-of-type(2){filter:brightness(1.1)}
.range{padding:0 10px;gap:6px}
.range input[type=date]{width:112px;font-size:12.5px}
.range input[type=date]:disabled{background:transparent;border-color:transparent;color:var(--navy);-webkit-text-fill-color:var(--navy);opacity:1;padding:0}
.range input[type=date]:disabled::-webkit-calendar-picker-indicator{display:none}
.rs{position:relative;width:118px;height:20px;flex:none}
.rs .rt{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:#CBD2D8}
.rs .rf{position:absolute;top:9px;height:3px;background:var(--azzurro)}
.rs input[type=range]{position:absolute;left:0;top:0;width:100%;height:20px;margin:0;padding:0;border:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.rs input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;border:2.5px solid var(--azzurro);pointer-events:auto;cursor:ew-resize}
.rs input[type=range]:disabled::-webkit-slider-thumb{border-color:#9AA3AB;cursor:default}
#pop{position:fixed;z-index:1001;pointer-events:none;display:none;width:200px;background:#fff;border:2px solid var(--azzurro);border-radius:10px;padding:10px 13px;font-size:14px;line-height:1.25;box-shadow:0 12px 28px rgba(24,33,62,.32)}
#pop b{display:block;font-weight:800;font-size:15px}
#pop .mw{color:var(--azzurro);font-weight:800;font-size:15px}
#pop .tc{color:#707078}
#pop img{position:absolute;right:11px;top:10px;height:28px}
#pop .pd{margin-top:7px;padding-top:7px;border-top:1px solid #E5E5E8;font-size:12.5px}
.range .dt{width:84px;font-size:13px}

.dtab .dh{display:flex;justify-content:space-between;font-size:13.5px;color:#555;border-bottom:1.5px solid #D9D9DE;height:22px;line-height:20px;padding:0}
.dtab .rowp{height:24px;line-height:24px;border-bottom:1px solid #EFEFF2;border-radius:0;font-size:15px}
.dtab .rowp b{font-weight:800}

/* ===== MOBILE (phone layout) ===== */
html.mob,html.mob body{height:auto;min-height:100%;overflow:auto;background:#EDEEF2}
html.mob #viewport{position:static;display:block}
html.mob #stage{width:100%;height:auto;overflow:visible;background:transparent;transform:none!important}
html.mob #hdr,html.mob #ftr{display:none}
html.mob svg.chart,html.mob .mcard svg:not(.mapsvg){max-width:100%;height:auto}
html.mob svg.chart{touch-action:pan-y}
html.mob #pop{display:none!important}
html.mob button{-webkit-tap-highlight-color:transparent}
.m-hdr{position:sticky;top:0;z-index:20;background:radial-gradient(420px 120px at 90% 0%,rgba(27,154,170,.3),transparent 70%),linear-gradient(120deg,#181B3A,#18213E 60%,#1b2a52);padding:10px 0 6px;box-shadow:0 4px 14px rgba(24,33,62,.3)}

.m-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:0 14px 6px}
.m-tt{min-width:0}
.m-title{font-size:21px;font-weight:300;color:#fff;line-height:1.15}
.m-sub{font-size:12.5px;color:#cfd5e6;margin-top:2px}
.m-fbtn{flex:none;position:relative;display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:20px;background:var(--pill);color:#fff;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.m-fbtn b{position:absolute;top:-4px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--rosso);font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.m-chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 6px;scrollbar-width:none}
.m-chips::-webkit-scrollbar{display:none}
.mchip{flex:none;height:38px;padding:0 17px;border-radius:19px;background:var(--pill);color:#fff;font-size:14.5px;font-weight:600;white-space:nowrap}
.mchip.on{background:linear-gradient(135deg,#25B1C2,#1B9AAA);box-shadow:0 2px 10px rgba(27,154,170,.55)}
.m-body{padding:12px 12px 8px;display:flex;flex-direction:column;gap:12px}
.mcard{background:linear-gradient(180deg,#fff,#FCFCFD);border-radius:16px;box-shadow:0 6px 18px rgba(24,33,62,.08),0 1px 3px rgba(24,33,62,.06);padding:14px}
.mc-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mc-h h3{font-size:16px;font-weight:800;line-height:1.25}
.mlink{flex:none;color:var(--azzurro);font-weight:800;font-size:14px;height:36px;padding:0 4px}
.m-un{font-size:12.5px;color:#666}
.m-big{font-size:46px;font-weight:800;line-height:1.05;letter-spacing:-1.5px}
.m-note{font-size:13.5px;color:#555;margin:2px 0 10px}
.m-note.c{text-align:center;margin:6px 0 0}
.m-status{display:flex;gap:10px}
.m-status .chip{position:static;height:40px;font-size:14.5px;padding:0 15px;border-radius:12px}
.m-dot{width:11px;height:11px;border-radius:50%;background:var(--vchiaro);display:block}
.mth{display:flex;justify-content:space-between;font-size:13px;color:#555;border-bottom:1.5px solid #D9D9DE;height:28px;align-items:center;margin-top:8px}
.mrow{display:flex;justify-content:space-between;align-items:center;width:100%;height:46px;border-bottom:1px solid #EFEFF2;font-size:16px;text-align:left}
.mrow b{font-weight:800}
.mrow:active{background:#F0F4F5}
.m-empty{padding:12px 0;color:#777;font-size:14px}

.mkpi{position:relative;background:linear-gradient(180deg,#fff,#FCFCFD);border-radius:14px;padding:11px 12px 10px 15px;box-shadow:0 6px 18px rgba(24,33,62,.08),0 1px 3px rgba(24,33,62,.06);overflow:hidden}

.mk-r{display:flex;align-items:center;justify-content:space-between;gap:4px;margin:3px 0 2px}

.mk-d{font-size:11.5px;white-space:nowrap}

.m-leg{justify-content:center;margin-top:4px;flex-wrap:wrap}
.m-hint{text-align:center;font-size:12px;color:#777;margin-top:6px}

.m3-v{font-size:21px;font-weight:800;letter-spacing:-.5px;margin:3px 0 1px}

.mchart svg{display:block;width:100%}
.m-cl{position:static;justify-content:center;margin-top:2px}
.m-t th{height:38px;font-size:13px;padding:0 8px}

.m-insight{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}
.m-dwrap{position:relative;width:180px;height:180px;margin:6px auto 0}
.m-dc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;letter-spacing:-1px}

.m-tiles.t3{grid-template-columns:repeat(3,1fr)}
.m-tiles.t2{grid-template-columns:1fr 1fr}
.mt{background:linear-gradient(180deg,#fff,#EEF6F7);border:1px solid #DCEBEE;border-radius:12px;padding:10px 6px;text-align:center}

.mt-i img,.mt-i svg{height:24px!important;width:24px!important;position:static!important;transform:none!important}
.mt-v{font-size:18px;font-weight:800;color:var(--azzurro);white-space:nowrap}

.m-foot img{height:52px}
.m-nav{position:fixed;left:0;right:0;bottom:0;z-index:25;height:64px;display:flex;background:#fff;box-shadow:0 -4px 16px rgba(24,33,62,.15);padding-bottom:env(safe-area-inset-bottom)}
.m-nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#8a8d99;font-size:11.5px;font-weight:700}
.m-nav button.on{color:var(--azzurro)}

.m-sec{margin-top:12px}
.m-st{font-size:13px;font-weight:800;color:#555;margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px}
.m-wrap{display:flex;flex-wrap:wrap;gap:8px}

function monthCum(sel){
 const n=28,ds=DS.month,out={act:new Array(n).fill(0),plan:new Array(n).fill(0)};
 sel.forEach(p=>{
  const q=[],r=[];let qs=0,rs=0;
  for(let d=1;d<=n;d++){const a=1+.07*Math.sin(d*.8+p.mwp),b=a*(1+(hash(p.id+'m'+d)-.5)*.2+(d>20?p.bias*.4:0));q.push(a);r.push(b);qs+=a;rs+=b;}
  let ca=0,cp=0;
  for(let d=0;d<n;d++){cp+=ds.plan[p.id]*q[d]/qs;ca+=ds.act[p.id]*r[d]/rs;out.plan[d]+=cp;out.act[d]+=ca;}
 });
 return out;
}

const AC={arezzo:.62,a:.55,b:.48,c:.58};
function detail(){
 const p=detailPlant();let h='';
 const ds=DS[S.period];
 const act=ds.act[p.id],plan=ds.plan[p.id],pc=act/plan*100,dm=act-plan;
 const dec=S.period==='ytd'?0:1;
 const pl={oggi:'oggi','7gg':'7 gg (media/giorno)','30gg':'30 gg (media/giorno)',ytd:'YTD'}[S.period];
 h+=`<div class="card" style="left:61px;top:106px;width:270px;height:514px"></div><div class="abs" style="left:61px;width:270px;text-align:center;top:128px;font-size:16px;font-weight:800">Realizzato vs piano · ${pl}</div>`;
 h+=`<div class="abs" style="left:93px;top:236px">${donut(pc)}</div><div class="abs big" style="left:93px;width:206px;text-align:center;top:322px;font-size:38px;font-weight:700">${fmt(pc,0)}%</div>`;
 h+=`<div class="abs" style="left:61px;width:270px;text-align:center;top:520px;font-size:14.5px;color:#444">Produzione ${fmt(act,dec)} MWh · Piano ${fmt(plan,dec)} MWh</div><div class="abs" style="left:61px;width:270px;text-align:center;top:543px;font-size:14.5px;font-weight:800;color:${dm<0?C.red:C.verde}">${fmtS(dm,dec)} MWh vs produzione attesa</div>`;
 let cats,A,P,ttl,xe=1;
 const sc=(arr,t)=>{const m=arr.reduce((s,x)=>s+x,0)/arr.length;return arr.map(x=>x*t/m);};
 let kind;
 if(S.period==='oggi'){
  cats=['07:00','08:00','09:00','10:00','11:00','12:00'];
  const sa=[.2,.6,1.3,1.9,2.3,2.5],sp=[.3,.8,1.5,2.1,2.6,2.9];
  const ta=sa.reduce((s,x)=>s+x,0),tp=sp.reduce((s,x)=>s+x,0);
  A=sa.map(x=>x*act/ta);
  if(p.id!=='arezzo'){const f=act/plan;A=sp.map((x,i)=>x*plan/tp*(1+(f-1)*(.4+.12*i)));const k=act/A.reduce((s,x)=>s+x,0);A=A.map(x=>x*k);}
  P=A.map((x,i)=>x*AC[p.id]*(1.15-.18*i/(A.length-1)));kind='oraria';
 }else if(S.period==='ytd'){
  const ms=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott'];cats=ms;
  const w=ms.map((_,i)=>Math.max(.18,.55+.45*Math.cos(2*Math.PI*((i*30.4+15)-172)/365)));w[9]*=.9;
  const ws=w.reduce((s,x)=>s+x,0);
  A=w.map(x=>plan*x/ws).map((x,i)=>x*(1+p.bias+(hash(p.id+'y'+i)-.5)*.12));const k=act/A.reduce((s,x)=>s+x,0);A=A.map(x=>x*k);
  P=A.map((x,i)=>x*AC[p.id]*(1+(hash(p.id+'ac'+i)-.5)*.1));kind='mensile';
 }else{
  const n=S.period==='7gg'?7:30;const lst=[];for(let i=n-1;i>=0;i--)lst.push(MAXDATE-i*DAY);
  const raw=lst.map(ms=>dayVals(p.id,ms));
  A=sc(raw.map(r=>r.act),act);
  P=A.map((x,i)=>x*AC[p.id]*(1+(hash(p.id+'ac'+i)-.5)*.1));
  cats=lst.map(ms=>{const d=new Date(ms);return d.getUTCDate()+'/'+(d.getUTCMonth()+1);});
  xe=n===7?1:5;kind='giornaliera';
 }
 h+=`<div class="card" style="left:345px;top:106px;width:410px;height:514px"></div><div class="abs" style="left:345px;width:410px;text-align:center;top:131px;font-size:17px;font-weight:800">Produzione vs Autoconsumo · ${kind} (MWh)</div>`;
 h+=`<div class="abs" style="left:351px;top:176px">`+lineChart('det',{w:398,h:392,cats,series:[{name:'Produzione',color:C.red,values:A},{name:'Autoconsumo',color:C.verde,values:P}],xLabelEvery:xe,fmtV:v=>fmt(v,S.period==='ytd'?0:2)+' MWh',tipTitle:i=>cats[i],tipExtra:i=>`<br>Autoconsumo: <b>${fmt(P[i]/A[i]*100,0)}%</b> della produzione`,pad:{l:40,r:26,t:10,b:30}})+`</div>`;
 h+=`<div class="chartleg" style="left:345px;width:410px;top:584px"><span><i style="background:${C.red}"></i>Produzione</span><span><i style="background:${C.verde}"></i>Autoconsumo</span></div>`;
 h+=`<div class="card" style="left:769px;top:106px;width:140px;height:514px"></div><div class="abs" style="left:769px;width:140px;text-align:center;top:131px;font-size:17px;font-weight:800">Dati di Targa</div>`;
 const g=(x,y,ic,v,l,sub,w)=>`<div class="gcard" style="left:${x}px;top:${y}px${w?`;width:${w}px`:''}">${ic}<div class="v">${v}</div><div class="l">${l}${sub?`<small>${sub}</small>`:''}</div></div>`;
 h+=g(777,216,IM('monitor'),`${fmt(p.mwp,1)} MW`,'Potenza nominale');
 h+=g(777,352,IM('growth'),`${p.nomPR}%`,'Performance ratio nominale');
 h+=g(777,487,IM('yield'),`${p.nomY}%`,'Yield nominale');
 const allAct=agg(ds,PLANTS).act,share=act/allAct,k=KP[S.period];
 const pot=k.pot*share,pot_pct=pot/p.mwp*100;
 const prv=k.pr-PLANTS.reduce((s,x)=>s+ds.plan[x.id]*x.pr,0)/agg(ds,PLANTS).plan;
 h+=`<div class="card" style="left:923px;top:106px;width:296px;height:514px"></div><div class="abs" style="left:923px;width:296px;text-align:center;top:131px;font-size:17px;font-weight:800">Dati Generali</div>`;
 h+=`<div class="abs" style="left:939px;top:175px;font-size:15px;font-weight:800">Stato Impianto</div>`;
 if(p.alarms.length)h+=`<button class="chip al" style="left:1098px;top:171px;height:26px" data-act="alarmpop">⚠&nbsp; ${p.alarms.length} allarm${p.alarms.length===1?'e':'i'}</button>`;
 else h+=`<div class="chip ok" style="left:1090px;top:171px;height:26px">✓&nbsp; Nessun allarme</div>`;
 if(S.alarmPop&&p.alarms.length)h+=`<div class="panel" style="left:880px;top:200px;width:330px;gap:4px;z-index:40"><div style="font-weight:800;font-size:14px;padding:2px 4px">Allarmi attivi · ${p.short}</div>${p.alarms.map(a=>`<div style="background:#FFF1E8;border-radius:8px;padding:7px 11px;font-size:14px"><b>${a.x}</b> <span style="color:#888;font-size:12px">(${a.t})</span></div>`).join('')}<button class="close" data-act="alarmpop">Chiudi ×</button></div>`;
 h+=g(937,212,IM('bulb'),`${fmt(pot,2)} MW`,`Potenza media · ${fmt(pot_pct,0)}%`);
 h+=g(1080,212,IM('sun'),`${fmt(p.irr,0)} W/m²`,'Irradianza',`Vento ${fmt(p.wind,1)} m/s`);
 h+=g(937,347,IM('co2'),`${fmt(k.co2*share,1)} t`,'CO₂ evitata');
 h+=g(1080,347,TRAIN(),`${fmt(k.km*share,0)} km`,'Km treno');
 h+=g(937,482,IM('growth'),`${fmt(p.pr+prv,1)}%`,'Performance ratio',undefined,268);
 return h;
}

function detailSeries(p,act,plan){
 let cats,A,P,xe=1,kind;
 const sc=(arr,t)=>{const m=arr.reduce((s,x)=>s+x,0)/arr.length;return arr.map(x=>x*t/m);};
 if(S.period==='oggi'){

  const ta=sa.reduce((s,x)=>s+x,0),tp=sp.reduce((s,x)=>s+x,0);
  A=sa.map(x=>x*act/ta);
  if(p.id!=='arezzo'){const f=act/plan;A=sp.map((x,i)=>x*plan/tp*(1+(f-1)*(.4+.12*i)));const k=act/A.reduce((s,x)=>s+x,0);A=A.map(x=>x*k);}

 }else if(S.period==='ytd'){
  cats=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott'];
  const w=cats.map((_,i)=>Math.max(.18,.55+.45*Math.cos(2*Math.PI*((i*30.4+15)-172)/365)));w[9]*=.9;const ws=w.reduce((s,x)=>s+x,0);
  A=w.map(x=>plan*x/ws).map((x,i)=>x*(1+p.bias+(hash(p.id+'y'+i)-.5)*.12));const k=act/A.reduce((s,x)=>s+x,0);A=A.map(x=>x*k);

 }else{

 return {cats,A,P,xe,kind};
}

  case 'zona':{const vv=(t.classList.contains('bar')&&S.zona===v)?'Italia':v;S.zona=vv;}S.regione=null;if(S.plant&&S.zona!=='Italia'&&PBY[S.plant].zone!==S.zona)S.plant=null;S.menu=null;break;
  case 'regione':S.regione=v||null;if(v){S.zona='Italia';if(S.plant&&PBY[S.plant].region!==v)S.plant=null;}S.menu=null;break;
  case 'plant':S.plant=v||null;if(v){S.callout=v;if(S.zona!=='Italia'&&PBY[v].zone!==S.zona)S.zona='Italia';if(S.regione&&PBY[v].region!==S.regione)S.regione=null;}S.menu=null;break;
  case 'period':setPeriod(v);break;
  case 'cmp':if(v==='custom'){S.cmp='custom';}else{S.cmp='prev';const r=presetRanges(S.period);S.A=r.A;S.B=r.B;}break;
  case 'plantsel':{S.sheet=null;const on=S.plant===v;S.plant=on?null:v;if(!on){if(S.zona!=='Italia'&&PBY[v].zone!==S.zona)S.zona='Italia';if(S.regione&&PBY[v].region!==S.regione)S.regione=null;}break;}
  case 'gotodetail':S.sheet=null;S.plant=v;S.callout=v;S.page='detail';S.alarmPop=false;S.menu=null;break;
  case 'alarmpop':if(MQ.matches){S.sheet=S.sheet==='alarms'?null:'alarms';}else{S.alarmPop=!S.alarmPop;S.menu=null;}break;
  case 'sheet':S.sheet=v||null;break;
  case 'plantsheet':S.sheet='plant:'+v;break;
  case 'reset':S.zona='Italia';S.regione=null;S.plant=null;S.cmp='prev';{const r=presetRanges(S.period);S.A=r.A;S.B=r.B;}break;
 }
 render();
});
stage.addEventListener('input',e=>{const t=e.target;if(!t.dataset||!t.dataset.rs)return;const k=t.dataset.rs[0],i=+t.dataset.rs[1],rs=t.parentNode,sl=rs.querySelectorAll('input');let a=+sl[0].value,b=+sl[1].value;if(i===0&&a>b){a=b;sl[0].value=a;}if(i===1&&b<a){b=a;sl[1].value=b;}S[k]=[MINDATE+a*DAY,MINDATE+b*DAY];const f=$('.rf',rs);f.style.left=a/NDAYS*100+'%';f.style.width=(b-a)/NDAYS*100+'%';const pill=rs.parentNode;pill.querySelector('[data-rng="'+k+'0"]').value=iso(S[k][0]);pill.querySelector('[data-rng="'+k+'1"]').value=iso(S[k][1]);});
stage.addEventListener('change',e=>{
 if(e.target.dataset&&e.target.dataset.rs){render();return;}
 const r=e.target.dataset&&e.target.dataset.rng;if(!r||!e.target.value)return;
 const k=r[0],i=+r[1],ms=Math.min(MAXDATE,Math.max(MINDATE,fromIso(e.target.value)));
 const cur=S[k].slice();cur[i]=ms;if(cur[0]>cur[1]){if(i===0)cur[1]=cur[0];else cur[0]=cur[1];}S[k]=cur;render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.menu||S.alarmPop||S.sheet)){S.menu=null;S.alarmPop=false;S.sheet=null;render();}});
/* tooltips */
const tip=$('#tip'),pop=$('#pop');
function showPop(html,x,y){pop.innerHTML=html;pop.style.display='block';const w=pop.offsetWidth,h=pop.offsetHeight;let l=x+18,t=y-h/2;if(l+w>innerWidth-6)l=x-w-18;pop.style.left=l+'px';pop.style.top=Math.max(6,Math.min(innerHeight-h-6,t))+'px';}
function hidePop(){pop.style.display='none';}
function showTip(html,x,y){tip.innerHTML=html;tip.style.display='block';const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(innerWidth-w-8,x+14)+'px';tip.style.top=Math.max(4,y-h-10)+'px';}
stage.addEventListener('mousemove',e=>{
 const svg=e.target.closest('svg.chart');
 if(svg){
  const c=CH[svg.dataset.chart];if(!c)return;const rc=svg.getBoundingClientRect();
  const px=(e.clientX-rc.left)/rc.width*c.w;let i=Math.round((px-c.pad.l)/c.iw*(c.n-1));i=Math.max(0,Math.min(c.n-1,i));
  const x=c.X(i);const ln=$('.cur',svg);ln.setAttribute('x1',x);ln.setAttribute('x2',x);ln.style.display='';
  $('.curd',svg).innerHTML=c.series.map(s=>`<circle cx="${x}" cy="${c.Y(s.values[i])}" r="6" fill="#fff" stroke="${s.color}" stroke-width="3"/>`).join('');
  showTip(`<b>${c.tipTitle(i)}</b><br>`+c.series.map(s=>`<span style="color:${s.color}">●</span> ${s.name}: ${c.fmtV(s.values[i])}`).join('<br>')+(c.tipExtra?c.tipExtra(i):''),e.clientX,e.clientY);return;
 }
 const bb=e.target.closest('.bubble');
 if(bb&&bb.dataset.plant){showPop(plantPop(bb.dataset.plant),e.clientX,e.clientY);tip.style.display='none';return;}
 hidePop();
 const t=e.target.closest('[data-tip]');
 if(t){showTip(esc(t.dataset.tip),e.clientX,e.clientY);return;}
 const rg=e.target.closest('[data-reg]');
 if(rg){const n=rg.dataset.reg;const pl=PLANTS.filter(p=>p.region===n);showTip(`<b>${esc(n)}</b>${pl.length?'<br>'+pl.map(p=>p.short+' · '+fmt(p.mwp,1)+' MW').join('<br>'):'<br>Nessun impianto'}`,e.clientX,e.clientY);return;}
 tip.style.display='none';
});
stage.addEventListener('mouseleave',()=>{tip.style.display='none';hidePop();});
stage.addEventListener('mouseout',e=>{const s=e.target.closest&&e.target.closest('svg.chart');if(s&&!(e.relatedTarget&&s.contains(e.relatedTarget))){const l=$('.cur',s);if(l)l.style.display='none';const d=$('.curd',s);if(d)d.innerHTML='';}});
/* fit to window */
function fit(){if(MQ.matches){stage.style.transform='none';return;}const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform=`scale(${s})`;}
addEventListener('resize',fit);MQ.addEventListener('change',()=>{fit();render();});fit();
render();
window.__S=S;window.__render=render;
})();
</script></body></html>
